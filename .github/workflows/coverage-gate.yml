name: Coverage Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "rel/*"
  push:
    branches:
      - "main"
      - "rel/*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Minimum 80% Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        # pipefail ensures a non-zero pytest exit code is not swallowed by tee.
        # fail_under = 80 is also enforced via [tool.coverage.report] in pyproject.toml.
        run: |
          set -o pipefail
          pytest --cov --cov-report=term-missing --cov-fail-under=80 | tee coverage.txt

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage.txt', 'utf8');
            const lines = report.split('\n');
            // extract the summary table and the final total line
            const start = lines.findIndex(l => l.includes('Name') && l.includes('Stmts'));
            const summary = start !== -1 ? lines.slice(start).join('\n') : report;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Coverage Report\n\`\`\`\n${summary}\n\`\`\``,
            });
